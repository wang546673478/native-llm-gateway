# Native LLM Gateway 本地开发模板（SQLite）
# 完整字段、生效边界和热重载说明见 docs/config-reference.md。
# 上游 Provider key、模型、定价、中转站和调度顺序由数据库/管理页面维护。

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 600s
  idle_timeout: 120s
  shutdown_timeout: 30s
  # 先运行 `npm --prefix frontend run build`；留空可作为纯 API 网关。
  static_dir: frontend/dist
  access_log:
    enabled: false
    body_dir: ./data/access
    buffer_size: 10000
    batch_size: 100
    flush_interval: 1s
    retention: 24h

database:
  driver: sqlite
  dsn: data/gateway.db
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 300s

# 代理端点的 Gateway Key 鉴权。生产环境必须保持开启。
# 这里的记录只负责首次启动补种；后续以数据库 gateway_keys 为准。
auth:
  enabled: true
  keys:
    - name: bootstrap
      key: "gw-change-this-before-use"
      allowed_models: ["*"]
      rate_limit:
        rpm: 100
        tpm: 500000

# 内置厂商协议面。Provider key 不写在 YAML，通过 Provider Keys 页面添加。
# 同一厂商的多个协议面共享 key 池；单 key 可在数据库中覆盖 billing_source。
providers:
  deepseek:
    enabled: true
    endpoint: "https://api.deepseek.com"
    protocol: openai
    billing_source: api
    timeout: 60s
    responses_api: true
    circuit_breaker: &default_circuit
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1

  deepseek-anthropic:
    enabled: true
    endpoint: "https://api.deepseek.com/anthropic"
    protocol: anthropic
    billing_source: api
    timeout: 90s
    force_thinking_disabled: true
    circuit_breaker: *default_circuit

  minimax:
    enabled: true
    endpoint: "https://api.minimaxi.com/anthropic"
    protocol: anthropic
    billing_source: token_plan
    timeout: 60s
    circuit_breaker: *default_circuit

  minimax-openai:
    enabled: true
    endpoint: "https://api.minimaxi.com/v1"
    protocol: openai
    billing_source: token_plan
    timeout: 60s
    responses_api: true
    circuit_breaker: *default_circuit

  mimo:
    enabled: true
    endpoint: "https://api.xiaomimimo.com/v1"
    protocol: openai
    billing_source: api
    timeout: 60s
    responses_api: true
    # MiMo 额度 cookie 是敏感信息，建议在管理页面热更新，不要写入模板。
    circuit_breaker: *default_circuit

  mimo-anthropic:
    enabled: true
    endpoint: "https://api.xiaomimimo.com/anthropic"
    protocol: anthropic
    billing_source: api
    timeout: 60s
    circuit_breaker: *default_circuit

  mimo-token-plan:
    enabled: true
    endpoint: "https://token-plan-cn.xiaomimimo.com/v1"
    protocol: openai
    billing_source: token_plan
    timeout: 60s
    responses_api: true
    circuit_breaker: *default_circuit

  mimo-token-plan-anthropic:
    enabled: true
    endpoint: "https://token-plan-cn.xiaomimimo.com/anthropic"
    protocol: anthropic
    billing_source: token_plan
    timeout: 60s
    circuit_breaker: *default_circuit

routing:
  # 空对象表示启用自动候选发现；不写 catch_all 则未知模型没有兜底路由。
  catch_all: {}
  default_strategy: priority

keypool:
  # sticky 始终选当前最高优先级可用 key；高位恢复后自动回位。
  key_rotation: sticky
  cooling_duration: 60s
  quota_enabled: true
  quota_probe_initial_delay: 5m
  quota_probe_max_backoff: 30m
  quota_probe_jitter_pct: 20
  quota_poll_interval: 60s
  quota_poll_jitter_pct: 10
  quota_http_timeout: 10s
  quota_user_agent: "native-llm-gateway/quota-restore-1.0"
  quota_warn_threshold_pct: 10

timeouts:
  provider_default: 60s

retry:
  # 每个计费层最多尝试的候选数；0 表示尝试该层全部候选。
  # HTTP 429 首次失败后最多再同 key 重试 10 次，不由此字段控制。
  max_attempts: 0
  # Relay 流从发起请求到首个上游 body 字节的候选预算；PING/data 到达后立即停止计时。
  # 180s 高于当前已观测 115.596s 的正常慢请求；调小前应先看该 relay/model 的 TTFT P99。
  relay_first_byte_timeout: 180s

logging:
  level: info
  format: console

# /metrics 当前始终注册在 server.port，不需要 metrics 配置块。
usage:
  flush_interval: 10s
  batch_size: 100

# 未配置 enabled 时默认开启。关闭后请求体原样透传。
fingerprint:
  enabled: true
  # 留空时每次进程启动生成一个内存值；固定值应为 64 字符十六进制字符串。
  canonical_device_id: ""

# 管理后台认证。启用时三个数值必须显式填写，当前服务端没有零值兜底。
# 首次启动会创建 admin / Gateway@2026；登录后立即修改默认密码。
admin_auth:
  enabled: true
  session_ttl: 168h
  max_login_attempts: 5
  login_ban_duration: 15m

# 以下结构仍能被解析但当前运行路径不消费，不要把它们当作控制面：
# redis.*、keypool.health_check_interval、retry.enabled/no_failover_on/failover_on、
# logging.output/file_path、metrics.*、usage.retention_days、
# admin_auth.session_cleanup_age、circuit_breaker.countable_errors/excluded_errors。
