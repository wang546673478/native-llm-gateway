# Native LLM Gateway — Docker 部署配置模板
# 用法:cp config.docker.example.yaml config.yaml,然后只改:
#   - database.dsn 的密码(与 docker-compose.yml 的 POSTGRES_PASSWORD 一致)
#   - providers 段(是否启用/模型价格等,与 config.example.yaml 相同)
# 容器内固定路径:static_dir=/app/web/dist、数据在 /app/data、PG 主机名 postgres
# (compose 服务名,容器网络内直接可达)
# 完整规格见 Native LLM Gateway — 完整实现规格书 v2.md 第 4.1 节
# 现状(2026-08):kimi 已移除(需要时按 docs/provider厂商定制包指南.md 加回);
# 路由 = catch_all 自动模式(alias/chains 已退役);provider key 全部由 DB 管理

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  # 非流式响应的绝对写上限;流式响应按 chunk 续期(proxy.doStream 的
  # SetWriteDeadline),实际语义变成「上游静默多久才算断流」— 活跃流不被掐断
  write_timeout: 300s
  idle_timeout: 120s
  shutdown_timeout: 30s
  # P-web-static: 前端构建产物目录(Go 直接托管,无 nginx;未命中 SPA fallback index.html)。
  # 为空 = 不启用(纯 API 网关);容器部署固定为 /app/web/dist
  static_dir: /app/web/dist
  # P67: 接入日志模块 — UI 在 Access Logs 页查看每次请求明细
  # 注意:必须 enabled=true,否则 Access Logs 页面返回 access_log_disabled
  access_log:
    enabled: true
    body_dir: /app/data/access-body
    buffer_size: 10000
    batch_size: 100
    flush_interval: 1s
    retention: 24h

database:
  driver: "postgres"        # sqlite | postgres
  # 密码必须与 docker-compose.yml 的 POSTGRES_PASSWORD 一致;主机名 postgres = compose 服务名
  dsn: "postgres://gateway:CHANGE_ME@postgres:5432/gateway"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 300s

redis:
  enabled: false            # 单实例 P0 阶段不需要,集群/P1+ 启用
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 10

# 客户端认证
# ⚠️ 代理端点认证开关:必须开启,否则任何能访问端口的人都能免费调用(白嫖上游额度)
auth:
  enabled: true
  keys:
    # 默认 dev key — 首次部署务必改掉或删除(页面创建正式 key 后即可删)
    - name: "dev-key"
      key: "gw-key-dev-please-change-me"
      allowed_models: ["*"]
      rate_limit:
        rpm: 100
        tpm: 500000

# Provider 配置
# 每个 Provider 默认 endpoint 和模型列表参考各 vendor 官方文档(2026-07)
# Provider 的 API key 不在这里配置(全部由 DB 管理,见下)

# Provider API Key 全部由 DB(provider_api_keys 表)管理
# 通过前端 Provider Keys 页面 / REST API 添加/删除
# 这里不再保留 keys: 字段(避免误导和重复)
providers:
  # --- DeepSeek (OpenAI 兼容,端点 /chat/completions 不带 /v1) ---
  # 文档:https://api-docs.deepseek.com/zh-cn/
  # 价格文档:https://api-docs.deepseek.com/zh-cn/quick_start/pricing
  # 上下文:1M tokens,最大输出 384K tokens
  # 注意:deepseek-chat / deepseek-reasoner 将于 2026-07-24 23:59(北京时间)弃用,
  # 分别映射到 v4-flash 的非 thinking / thinking 模式
  deepseek:
    enabled: true
    billing_source: "api"
    endpoint: "https://api.deepseek.com"
    protocol: "openai"
    timeout: 60s
    # 原生支持 OpenAI Responses API(Codex 透传)
    responses_api: true
    models:
      # v4-flash: 官方价(元/百万 tokens,按@高峰时段)——未命中 3.0、命中 0.10、输出 9.0
      - id: "deepseek-v4-flash"
        aliases: ["coding-model", "chat-model"]
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.009
        cost_per_1k_cache_read: 0.0001
        cost_per_1k_cache_creation: 0.0
      # v4-pro: 官方价(元/百万 tokens,按@高峰时段)——未命中 9.0、命中 0.30、输出 27.0,支持 thinking
      - id: "deepseek-v4-pro"
        aliases: ["pro-model"]
        cost_per_1k_input: 0.009
        cost_per_1k_output: 0.027
        cost_per_1k_cache_read: 0.0003
        cost_per_1k_cache_creation: 0.0
    # P41 DeepSeek 支持的 API 特性(都通过 body 透传,Gateway 不需特殊处理):
    #   - Thinking 模式:extra_body={"thinking":{"type":"enabled"}}(v4-pro)
    #   - Tool use / function calling:OpenAI 标准 tools 数组
    #   - JSON mode:response_format={"type":"json_object"}
    #   - Prefix caching:默认开启,响应 prompt_cache_hit_tokens / prompt_cache_miss_tokens
    #   - Streaming:stream=true,SSE 格式
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  # --- DeepSeek Anthropic 兼容(给 Anthropic SDK 用户) ---
  # 文档:https://api-docs.deepseek.com/zh-cn/ (Anthropic 协议部分)
  deepseek-anthropic:
    enabled: true
    # P-deepseek-thinking: DeepSeek /anthropic 的 thinking 校验会拒绝 compact 后的历史
    # (Claude Code 剥离 thinking 块 → 400 "content[].thinking ... must be passed back"),
    # 强制 thinking=disabled 绕开 — flash 本来就是非 thinking 模型,无能力损失
    force_thinking_disabled: true
    billing_source: "api"
    endpoint: "https://api.deepseek.com/anthropic"
    protocol: "anthropic"
    timeout: 90s
    models:
      - id: "deepseek-v4-flash"
        aliases: []
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.009
        cost_per_1k_cache_read: 0.0001
        cost_per_1k_cache_creation: 0.0
      - id: "deepseek-v4-pro"
        aliases: []
        cost_per_1k_input: 0.009
        cost_per_1k_output: 0.027
        cost_per_1k_cache_read: 0.0003
        cost_per_1k_cache_creation: 0.0
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  # --- 智谱 GLM (OpenAI 兼容) ---
  # 文档:https://docs.bigmodel.cn
  # 价格(2026-08):glm-5.2 输入 ¥8/M、输出 ¥28/M、缓存命中 ¥2/M(每百万 token)
  # 上下文:1M tokens,最大输出 128K tokens
  # 注意:GLM Coding Plan 套餐需专属 Coding 端点,本块为标准 API 计费
  glm:
    enabled: true
    billing_source: "api"
    endpoint: "https://open.bigmodel.cn/api/paas/v4"
    protocol: "openai"
    timeout: 60s
    # 官方无 /responses API,Codex 请求不会路由到本厂商
    responses_api: false
    models:
      # glm-5.2:旗舰,1M 上下文/128K 输出;支持思考模式(thinking + reasoning_effort,
      # 默认 max),响应带 reasoning_content;上下文缓存自动生效
      # 价格按 ¥/1k:输入 0.008、输出 0.028、缓存命中 0.002
      - id: "glm-5.2"
        aliases: []
        cost_per_1k_input: 0.008
        cost_per_1k_output: 0.028
        cost_per_1k_cache_read: 0.002
        cost_per_1k_cache_creation: 0.0
      # 其余在售文本模型(glm-5.1 / glm-5 / glm-5-turbo / glm-4.7 / glm-4.6 / glm-4.5)
      # 按官方价格页 https://bigmodel.cn/pricing 补价格后加入列表
    keys: []  # P30: 用 DB(provider_api_keys)管,这里留空
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  # --- 智谱 GLM (Anthropic 兼容,给 Claude Code / Anthropic SDK 用户) ---
  # 文档:https://docs.bigmodel.cn/cn/guide/develop/claude/introduction
  # 端点:POST https://open.bigmodel.cn/api/anthropic/v1/messages
  # 鉴权:x-api-key: {ZHIPU_API_KEY} / anthropic-version: 2023-06-01
  # 与 glm 共用同一组 Provider Key(同一 vendor,key 池共享)
  glm-anthropic:
    enabled: true
    billing_source: "api"
    endpoint: "https://open.bigmodel.cn/api/anthropic"
    protocol: "anthropic"
    timeout: 60s
    models:
      - id: "glm-5.2"
        aliases: []
        cost_per_1k_input: 0.008
        cost_per_1k_output: 0.028
        cost_per_1k_cache_read: 0.002
        cost_per_1k_cache_creation: 0.0
    keys: []  # 与 glm 共享同一组 Provider Key
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  # --- 通义千问 Qwen (OpenAI 兼容模式,DashScope) ---
  # 文档:https://help.aliyun.com/zh/model-studio/completions
  # 端点:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  qwen:
    enabled: true
    billing_source: "api"
    endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    protocol: "openai"
    timeout: 60s
    models:
      - id: "qwen-plus"             # 商用主力
        aliases: []
        cost_per_1k_input: 0.0058
        cost_per_1k_output: 0.0144
      - id: "qwen-turbo"            # 更快更便宜
        aliases: []
        cost_per_1k_input: 0.00216
        cost_per_1k_output: 0.0043
      - id: "qwen-max"              # 旗舰
        aliases: []
        cost_per_1k_input: 0.144
        cost_per_1k_output: 0.432
      - id: "qwen-coder-plus"       # 代码
        aliases: ["qwen-coder"]
        cost_per_1k_input: 0.0252
        cost_per_1k_output: 0.0504
      - id: "qwen-long"             # 长上下文(1M tokens)
        aliases: []
        cost_per_1k_input: 0.0036
        cost_per_1k_output: 0.0144
      - id: "qwen-vl-max"           # 多模态视觉
        aliases: []
        cost_per_1k_input: 0.0216
        cost_per_1k_output: 0.0648
      - id: "qwen3-235b-a22b"       # Qwen3 旗舰 MoE
        aliases: []
        cost_per_1k_input: 0.0288
        cost_per_1k_output: 0.0864
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  # --- MiniMax (稀宇科技,Anthropic 兼容) ---
  # 文档:https://platform.minimaxi.com/docs/api-reference/api-overview
  # Anthropic 兼容端点(推荐):POST https://api.minimaxi.com/anthropic/v1/messages
  # 鉴权:Authorization: Bearer <API_KEY>
  # 额外 header:anthropic-version(由 anthropic_compatible.Base 自动加)
  # M3 专属参数:thinking / reasoning_split / service_tier 通过 extra_body 传
  minimax:
    enabled: true
    billing_source: "token_plan"   # 包月套餐,优先路由,quota 用完自动降级到 api 层
    endpoint: "https://api.minimaxi.com/anthropic"
    protocol: "anthropic"
    timeout: 30s
    models:
      - id: "MiniMax-M3"              # 1M tokens,旗舰
        aliases: ["MiniMax"]
        cost_per_1k_input: 0.0021
        cost_per_1k_output: 0.0084
        # P-provider-vendor: 缓存价(文档 2026-08-04)— M3 仅自动缓存(读 0.42 元/M),无主动缓存
        cost_per_1k_cache_read: 0.00042
        # P-quota-512k: 官方悬崖 — 输入含缓存 > 512k 时输入/输出/缓存全项 ×2(永久五折后价)
        long_context_input_threshold: 512000
        long_context_multiplier: 2
      - id: "MiniMax-M2.7"            # 204,800
        aliases: []
        cost_per_1k_input: 0.0021
        cost_per_1k_output: 0.0084
        cost_per_1k_cache_read: 0.00042
        cost_per_1k_cache_creation: 0.002625
      - id: "MiniMax-M2.7-highspeed"  # 204,800,更快
        aliases: []
        cost_per_1k_input: 0.0042
        cost_per_1k_output: 0.0168
        cost_per_1k_cache_read: 0.00042
        cost_per_1k_cache_creation: 0.002625
      - id: "MiniMax-M2.5"            # 204,800
        aliases: []
        cost_per_1k_input: 0.0021
        cost_per_1k_output: 0.0084
        cost_per_1k_cache_read: 0.00021
        cost_per_1k_cache_creation: 0.002625
      - id: "MiniMax-M2.5-highspeed"
        aliases: []
        cost_per_1k_input: 0.0042
        cost_per_1k_output: 0.0168
        cost_per_1k_cache_read: 0.00021
        cost_per_1k_cache_creation: 0.002625
      - id: "MiniMax-M2.1"            # 204,800 早期稳定
        aliases: []
        cost_per_1k_input: 0.0021
        cost_per_1k_output: 0.0084
        cost_per_1k_cache_read: 0.00021
        cost_per_1k_cache_creation: 0.002625
      - id: "MiniMax-M2.1-highspeed"
        aliases: []
        cost_per_1k_input: 0.0042
        cost_per_1k_output: 0.0168
        cost_per_1k_cache_read: 0.00021
        cost_per_1k_cache_creation: 0.002625
      - id: "MiniMax-M2"              # 204,800 基础
        aliases: []
        cost_per_1k_input: 0.0021
        cost_per_1k_output: 0.0084
        cost_per_1k_cache_read: 0.00021
        cost_per_1k_cache_creation: 0.002625
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  minimax-openai:                   # 同一供应商,不同协议端点,共享 key
    enabled: true
    billing_source: "token_plan"
    endpoint: "https://api.minimaxi.com/v1"
    protocol: "openai"
    timeout: 30s
    responses_api: true
    models:
      - id: "MiniMax-M3"            # 与 minimax(anthropic)共享模型列表
        aliases: []
        cost_per_1k_input: 0.0021
        cost_per_1k_output: 0.0084
        cost_per_1k_cache_read: 0.00042
        long_context_input_threshold: 512000
        long_context_multiplier: 2
    keys: []  # 与 minimax 共享同一组 Provider Key
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  # --- 小米 MIMO (OpenAI + Anthropic 兼容 × 按量付费/套餐 两套端点) ---
  # 文档:https://mimo.mi.com/docs/zh-CN/quick-start/summary/welcome
  # 按量付费:https://api.xiaomimimo.com/v1(key sk-xxx);套餐:https://token-plan-cn.xiaomimimo.com/v1(key tp-xxx)
  # 两套 key 不通用,加 key 时按 billing 类型区分(sk- 选 api,tp- 选 token_plan)
  # 鉴权:Authorization: Bearer 或 api-key: header;思考模式:chat 面 thinking.type、
  # responses 面 reasoning.effort;思考模式不支持 temperature/top_p(强制 1.0/0.95)
  # 429 = 限流 或 套餐额度耗尽(双义);402 = 按量余额不足
  # 余额/套餐查询:控制台未文档化端点(cookie 鉴权,约 1 天过期)— balancer 已接入,
  # cookie 配在下方 quota_cookie(账号级,敏感凭据,只放本地 config.yaml,不放本示例)
  # 套餐条款(已确认接入):配额仅限编程工具场景,禁止 API 调用后端
  # 价格(¥/M,÷1000 进 cost_per_1k):pro 命中0.025/未命中3.00/输出6.00;v2.5 0.02/1.00/2.00
  # v2 系列(mimo-v2-pro/v2-omni/v2-flash)已于 2026-06-30 弃用,勿配置
  mimo:
    enabled: true
    billing_source: "api"
    endpoint: "https://api.xiaomimimo.com/v1"
    protocol: "openai"
    timeout: 60s
    responses_api: true            # 原生支持 /responses(endpoint 已含 /v1)
    # quota_cookie: 控制台登录 cookie(账号级,约 1 天过期)— 敏感凭据,只放本地
    #   config.yaml;抓取方法:浏览器登录 https://platform.xiaomimimo.com/console/plan-manage
    #   → F12 → 复制任意请求的完整 Cookie header 值(含 api-platform_serviceToken=...)
    #   过期后轮询自动退化(错误码驱动,保守安全),重新抓取填上重启即可
    # quota_cookie: ""
    models:
      - id: "mimo-v2.5-pro"
        aliases: []
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.006
        cost_per_1k_cache_read: 0.000025
      - id: "mimo-v2.5"
        aliases: ["mimo"]
        cost_per_1k_input: 0.001
        cost_per_1k_output: 0.002
        cost_per_1k_cache_read: 0.00002
    default_model: "mimo-v2.5"     # 便宜优先,pro 按需显式指定
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  # 同一供应商,Anthropic 兼容端点,共享 key 池(Claude Code 走这里)
  mimo-anthropic:
    enabled: true
    billing_source: "api"
    endpoint: "https://api.xiaomimimo.com/anthropic"
    protocol: "anthropic"
    timeout: 60s
    models:
      - id: "mimo-v2.5-pro"
        aliases: []
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.006
        cost_per_1k_cache_read: 0.000025
      - id: "mimo-v2.5"
        aliases: []
        cost_per_1k_input: 0.001
        cost_per_1k_output: 0.002
        cost_per_1k_cache_read: 0.00002
    default_model: "mimo-v2.5"
    # force_thinking_disabled: true  # 若 Claude Code compact 后 400(thinking 块未回传)再开,与 DeepSeek 同款
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  # Token Plan 套餐端点(优先路由,额度耗尽 429 自动降级到 api 层)
  mimo-token-plan:
    enabled: true
    billing_source: "token_plan"
    endpoint: "https://token-plan-cn.xiaomimimo.com/v1"
    protocol: "openai"
    timeout: 60s
    responses_api: true
    models:
      - id: "mimo-v2.5-pro"
        aliases: []
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.006
        cost_per_1k_cache_read: 0.000025
      - id: "mimo-v2.5"
        aliases: []
        cost_per_1k_input: 0.001
        cost_per_1k_output: 0.002
        cost_per_1k_cache_read: 0.00002
    default_model: "mimo-v2.5"
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  mimo-token-plan-anthropic:
    enabled: true
    billing_source: "token_plan"
    endpoint: "https://token-plan-cn.xiaomimimo.com/anthropic"
    protocol: "anthropic"
    timeout: 60s
    models:
      - id: "mimo-v2.5-pro"
        aliases: []
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.006
        cost_per_1k_cache_read: 0.000025
      - id: "mimo-v2.5"
        aliases: []
        cost_per_1k_input: 0.001
        cost_per_1k_output: 0.002
        cost_per_1k_cache_read: 0.00002
    default_model: "mimo-v2.5"
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]
      excluded_errors: ["429"]

  # --- Google Gemini (Google 协议) ---
  # 文档:https://ai.google.dev/gemini-api/docs/models
  # 端点:POST {endpoint}/models/{model}:generateContent
  # 鉴权:x-goog-api-key header
  # Body:{contents:[{parts:[{text:"..."}], role:"user"}]}
  # Usage 字段名:promptTokenCount / candidatesTokenCount / totalTokenCount
  # 注意:gemini-2.0-flash / gemini-1.5-pro 已 shut down / deprecated
  gemini:
    enabled: true
    billing_source: "api"
    endpoint: "https://generativelanguage.googleapis.com/v1beta"
    protocol: "google"
    timeout: 60s
    models:
      - id: "gemini-2.5-flash"           # stable 推荐
        aliases: ["gemini-flash"]
        cost_per_1k_input: 0.00054
        cost_per_1k_output: 0.00216
      - id: "gemini-2.5-flash-lite"      # stable 便宜
        aliases: []
        cost_per_1k_input: 0.00027
        cost_per_1k_output: 0.00108
      - id: "gemini-2.5-pro"             # stable 强
        aliases: ["gemini-pro"]
        cost_per_1k_input: 0.009
        cost_per_1k_output: 0.036
      - id: "gemini-3.5-flash"           # stable 新
        aliases: []
        cost_per_1k_input: 0.00072
        cost_per_1k_output: 0.00288
      - id: "gemini-3.1-flash-lite"      # stable
        aliases: []
        cost_per_1k_input: 0.00018
        cost_per_1k_output: 0.00072
    circuit_breaker:
      failure_threshold: 5
      failure_window: 60s
      open_timeout: 30s
      half_open_requests: 1
      countable_errors: ["5xx", "timeout", "connection_error"]

# 路由规则 — 唯一规则:catch_all(无路由表,alias/chains 已退役)
routing:
  # 自动模式(catch_all: {} 空规则):所有 enabled provider 自动参与,
  #   - 客户端发任何 model 名(gpt-5 / qwen-plus / 任意探测名)→ 一律走这条链,
  #     客户端模型名只是标签,不参与路由决策(真实名也不直连声明它的 provider)
  #   - 协议面按请求路径过滤(/v1/messages → anthropic 面,/v1/chat/completions → openai 面)
  #   - 每个 provider 用它的默认模型承接:显式 default_model 或 models 第一个声明
  #   - tier 计费自动(token_plan → api → free):token plan 额度耗尽 → 自动切 api
  #     计费的 provider,无需改配置;没 key 的 provider 自动跳过
  #   - 同 tier 桶内候选按 name 确定性排序(自动模式无优先级概念)
  # 显式模式(providers 列表):自定义参与方与优先级 — priority 数字小者先试;
  # tier 分桶在排序之后,priority 只影响同 tier 桶内顺序,「token_plan 未耗尽
  # 不落 api」不变式不受影响。注意:显式列表 = 未列出的 provider 不再参与链!
  # 新增 provider 必须同步加进列表,否则它不会进链
  # catch_all:
  #   providers:
  #     - name: "minimax"
  #       model: "MiniMax-M3"
  #       priority: 1
  #     - name: "mimo-token-plan-anthropic"
  #       model: "mimo-v2.5"
  #       priority: 2
  #     - name: "deepseek-anthropic"
  #       model: "deepseek-v4-flash"
  #       priority: 3
  catch_all: {}
  default_strategy: "priority"

# Key Pool 配置(P3 阶段真正生效)
keypool:
  cooling_duration: 60s
  health_check_interval: 30s
  key_rotation: "sticky"   # sticky(默认,先用尽一把再切) | round_robin / least_used / random 可选
  # P68: quota polling / restore 全部 flat key(和 KeyPoolConfig struct 的
  # mapstructure tag 对齐)。不要嵌 quota: 子块,viper 不会自动展开。
  quota_enabled: true
  quota_probe_initial_delay: 5m
  quota_probe_max_backoff: 30m
  quota_probe_jitter_pct: 20
  quota_poll_interval: 60s
  quota_poll_jitter_pct: 10
  quota_http_timeout: 10s
  quota_user_agent: "native-llm-gateway/quota-restore-1.0"

# 超时与重试(P5 阶段真正生效)
# HTTP server 真正生效的超时见 server.read_timeout/write_timeout/idle_timeout
# (Server.ReadTimeout/WriteTimeout/IdleTimeout);timeouts 仅剩 provider_default
timeouts:
  provider_default: 60s

retry:
  enabled: true
  max_attempts: 3
  no_failover_on:
    - "invalid_request"
    - "auth"
  failover_on:
    - "rate_limit"
    - "server_error"
    - "timeout"
    - "connection"

# 日志
logging:
  level: "info"
  format: "console"         # P0 阶段用 console 方便看;生产改 json
  output: "stdout"
  file_path: "/app/data/logs/gateway.log"

# 指标(P8 阶段真正生效)
metrics:
  enabled: false
  path: "/metrics"
  port: 9090

# Usage(P8 阶段真正生效)
usage:
  flush_interval: 10s
  batch_size: 100
  retention_days: 90

# 设备指纹归一化(可选)—— 见 config.example.yaml 同段注释
fingerprint:
  # enabled: true
  # canonical_device_id: ""
